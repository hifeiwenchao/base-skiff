name: Test and build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q --junitxml=build/test-results.xml
      - name: Summarize test results
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/report_tests.py build/test-results.xml
      - name: Build and smoke test
        run: python scripts/build.py --smoke-test
      # Archive on the runner to preserve executable bits and macOS app symlinks.
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/build-*/BaseSkiff.app dist/BaseSkiff-macOS.zip
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/build-*/BaseSkiff -DestinationPath dist/BaseSkiff-Windows.zip
      - name: Archive Linux app
        if: runner.os == 'Linux'
        run: |
          bundles=(dist/build-*/BaseSkiff)
          tar -C "$(dirname "${bundles[0]}")" -czf dist/BaseSkiff-Linux.tar.gz BaseSkiff
      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: BaseSkiff-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/BaseSkiff-*.zip
            dist/BaseSkiff-*.tar.gz
          if-no-files-found: error
          retention-days: 14
