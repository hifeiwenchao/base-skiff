[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "baseskiff"
version = "0.1.0"
description = "A native desktop workspace for SQL, MongoDB, and Redis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.9,<7",
    "cryptography>=43",
    "PyMySQL>=1.1",
    "psycopg[binary]>=3.2",
    "pymongo>=4.10,<5",
    "redis>=5.2",
    "msgpack>=1.1,<2",
    "oracledb>=3",
    "paramiko>=3.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "fakeredis>=2.26", "pyinstaller>=6.16"]

[project.gui-scripts]
baseskiff = "baseskiff.app:main"

[tool.setuptools.packages.find]
include = ["baseskiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["integration: opt-in tests against explicitly configured local test databases"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
